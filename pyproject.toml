[project]
name = "qx-stc-isp"
version = "0.7.0"
description = "Astrspire 串口烧录与数据调试工作台（预览版）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "intelhex>=2.3.0,<3",
    "pyserial>=3.5,<4",
    "pyside6>=6.8,<7",
    "pyqtgraph==0.14.0",
    "numpy==2.5.4",
    "cryptography==50.0.2",
]

[dependency-groups]
capture = [
    "frida==17.23.2",
]
dev = [
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx_stc_isp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
